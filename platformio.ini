; Two display variants, same wiring on the LCD SPI pins:
;   pico         — original GMT147SPI 1.47" 172x320 ST7789, encoder only (fallback)
;   pico-st7796  — Hosyond 4.0" 480x320 ST7796S + FT6336 capacitive touch
; Build/upload the variant matching the fitted panel: pio run -e pico-st7796 -t upload
[env]
platform                    = https://github.com/maxgerhardt/platform-raspberrypi.git
board                       = rpipico
framework                   = arduino
board_build.core            = earlephilhower
board_build.filesystem_size = 0m
monitor_speed               = 115200

[env:pico]
lib_deps =
    teemuatlut/TMCStepper
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library

[env:pico-st7796]
lib_deps =
    teemuatlut/TMCStepper
    bodmer/TFT_eSPI
build_flags =
    -DLCD_ST7796
    ; TFT_eSPI user setup (no User_Setup.h edits needed)
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=9
    -DTFT_DC=5
    -DTFT_RST=6
    -DLOAD_GLCD=1
    ; ST7796S handles more, drop to 27 MHz if wiring is long/noisy
    -DSPI_FREQUENCY=40000000
